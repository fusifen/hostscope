<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#673de6" />
    <title>Content Manager — HostScope</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f6f7fb;
      }
      #cms-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      #cms-boot img {
        width: 52px;
        height: 52px;
      }
      #cms-boot h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #0a0f1e;
      }
      #cms-boot p {
        margin: 0;
        max-width: 420px;
        font-size: 13px;
        line-height: 1.6;
        color: #5f6a89;
      }
      #cms-boot code {
        background: #eceef6;
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 12px;
        color: #5527c4;
      }
    </style>
  </head>
  <body>
    <!--
      Sveltia CMS — a Git-based content manager.

      It reads every collection, field and widget definition from /admin/config.yml
      and commits content straight back to the GitHub repository, so there is no
      database and no server to maintain.

      Before it will work you must:
        1. Set `backend.repo` in config.yml to your own GitHub repository.
        2. Deploy an OAuth broker (see the README) and point `backend.base_url` at it,
           OR use `backend.name: git-gateway` with Netlify Identity.
        3. Add your site's domain as an allowed origin on the OAuth app.
    -->
    <div id="cms-boot">
      <img src="/images/brand/hostscope-logo.svg" alt="" />
      <h1>Loading the content manager…</h1>
      <p>
        If this message stays on screen, Sveltia could not reach GitHub. Check that
        <code>backend.repo</code> in <code>/admin/config.yml</code> points at your repository and
        that an OAuth broker is configured.
      </p>
    </div>

    <script type="module">
      // Swap the boot screen for the CMS once it has mounted.
      const boot = document.getElementById('cms-boot');
      window.addEventListener('sveltia-cms-loaded', () => boot?.remove());
      // Fallback: hide the splash shortly after the module resolves.
      import('https://unpkg.com/@sveltia/cms@0.213.5/dist/sveltia-cms.js')
        .then(() => {
          window.setTimeout(() => boot?.remove(), 600);
        })
        .catch(() => {
          /* leave the boot message in place so the failure is visible */
        });
    </script>
  </body>
</html>
