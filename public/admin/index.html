<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#673de6" />
    <title>Content Manager — HostScope</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f6f7fb;
      }
      #cms-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      #cms-boot img {
        width: 52px;
        height: 52px;
      }
      #cms-boot h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #0a0f1e;
      }
      #cms-boot p {
        margin: 0;
        max-width: 460px;
        font-size: 13px;
        line-height: 1.6;
        color: #5f6a89;
      }
      #cms-boot code {
        background: #eceef6;
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 12px;
        color: #5527c4;
      }
      #cms-boot.is-failed h1 {
        color: #b42318;
      }
      #cms-boot.is-failed #cms-spinner {
        display: none;
      }
      #cms-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #d9dced;
        border-top-color: #673de6;
        border-radius: 50%;
        animation: cms-spin 0.8s linear infinite;
      }
      @keyframes cms-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #cms-detail {
        display: none;
        max-width: 620px;
        margin: 0;
        padding: 12px 14px;
        border: 1px solid #f3c9c4;
        border-radius: 8px;
        background: #fff5f4;
        color: #7a271a;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #cms-detail.is-shown {
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
      Sveltia CMS — a Git-based content manager.

      It reads every collection, field and widget definition from /admin/config.yml
      and commits content straight back to the GitHub repository, so there is no
      database and no server to maintain.

      `backend.repo` in config.yml is already set to fusifen/hostscope. To sign in:

        • Token (no setup): click "Sign In with Token" and paste a GitHub PAT with
          `Contents: Read and write` on that repository.
        • OAuth (for teams): deploy https://github.com/sveltia/sveltia-cms-auth to
          Cloudflare Workers, register a GitHub OAuth app with callback
          `<worker-url>/callback`, then set `backend.base_url` to the Worker URL.

      See DEPLOY.md for the full runbook.

      ── Two traps that make this page fail silently ──────────────────────────

      1. The bundle must load as a CLASSIC script, not an ES module.
         `<script type="module" src="./sveltia-cms.js">` — or a dynamic
         `import('./sveltia-cms.js')` — loads without error and even fetches
         config.yml, but Sveltia never mounts and nothing is logged. The bundle
         itself warns about this: "The Sveltia CMS script is not an ES module.
         Remove the type="module" attribute." Keep the plain <script> below.

      2. It must be served from this origin, not from a CDN. The upstream CDN
         (unpkg.com) is unreachable from mainland China, which leaves the editor
         stuck on the splash with no error. Sveltia resolves its lazy chunks
         relative to `document.currentScript.src`, so self-hosting keeps those
         same-origin too.

      To upgrade: `npm pack @sveltia/cms@<version>`, then copy
      `package/dist/sveltia-cms.js` and `package/dist/chunks/react-dom.js` here
      (strip the trailing `//# sourceMappingURL=` lines — the maps are not shipped).
    -->
    <div id="cms-boot">
      <img src="/images/brand/hostscope-logo.svg" alt="" onerror="this.remove()" />
      <div id="cms-spinner" role="status" aria-label="Loading"></div>
      <h1 id="cms-title">Loading the content manager…</h1>
      <p id="cms-hint">
        This usually takes a second. Sveltia reads <code>config.yml</code>, then resolves
        the GitHub repository before it renders anything.
      </p>
      <pre id="cms-detail"></pre>
    </div>

    <!--
      Classic script on purpose — see trap 1 above. `defer` so the splash paints
      first instead of blocking on a 1.9 MB download.
    -->
    <script>
      window.__cmsBundleError = null;
    </script>
    <script
      src="./sveltia-cms.js"
      defer
      onerror="window.__cmsBundleError = 'sveltia-cms.js failed to load (HTTP error or network failure)'"
    ></script>

    <script type="module">
      const boot = document.getElementById('cms-boot');
      const titleEl = document.getElementById('cms-title');
      const hintEl = document.getElementById('cms-hint');
      const detailEl = document.getElementById('cms-detail');

      let ready = false;

      /** Sveltia has rendered — get the splash out of the way. */
      function settle() {
        if (ready) return;
        ready = true;
        window.clearInterval(poll);
        window.clearTimeout(deadline);
        boot?.remove();
      }

      function fail(title, hint, detail) {
        if (ready) return;
        ready = true;
        window.clearInterval(poll);
        window.clearTimeout(deadline);
        boot?.classList.add('is-failed');
        titleEl.textContent = title;
        hintEl.innerHTML = hint;
        if (detail) {
          detailEl.textContent = detail;
          detailEl.classList.add('is-shown');
        }
      }

      // ── Readiness ──────────────────────────────────────────────────────────
      // Do NOT remove the splash on a fixed timer. Sveltia has to fetch
      // config.yml and resolve the repository before it paints, which can easily
      // outlast any timeout short enough to feel responsive. Dropping the splash
      // early leaves a blank white page — which is exactly what a stuck CMS looks
      // like to the person using it.
      //
      // Every Svelte component carries a scoped class such as `svelte-1u7mtuj`,
      // so the first one to appear means the app has mounted (its own error
      // screen counts too, and should be left visible).
      const poll = window.setInterval(() => {
        if (!document.body.contains(boot)) settle();
        else if (document.querySelector('[class*="svelte-"]')) settle();
      }, 200);

      const deadline = window.setTimeout(diagnose, 15000);

      // ── Diagnosis ──────────────────────────────────────────────────────────
      async function diagnose() {
        if (ready) return;

        if (window.__cmsBundleError) {
          fail(
            'The CMS bundle failed to load',
            '<code>/admin/sveltia-cms.js</code> could not be fetched. If this site was ' +
              'just deployed, wait for the build to finish and reload.',
            window.__cmsBundleError,
          );
          return;
        }

        // The single config value that silently hangs Sveltia: a placeholder repo.
        // It resolves `backend.repo` before rendering, so a value that is not a real
        // repository means it waits forever without ever showing an error.
        let repo = null;
        let configOk = false;
        try {
          const res = await fetch('./config.yml', { cache: 'no-store' });
          if (res.ok) {
            configOk = true;
            repo = (await res.text()).match(/^[ \t]*repo:[ \t]*(\S+)[ \t]*$/m)?.[1] ?? null;
          }
        } catch {
          /* fall through to the generic message */
        }

        if (configOk && repo && /^(your-|owner\/|<|.*your-github)/i.test(repo)) {
          fail(
            'The CMS cannot start: backend.repo is still a placeholder',
            'Sveltia resolves the repository before it renders anything, so it waits forever ' +
              'rather than showing an error. Set <code>backend.repo</code> in ' +
              '<code>/admin/config.yml</code> to your real repository, then redeploy.',
            `config.yml currently says:\n  repo: ${repo}\n\nExpected something like:\n  repo: fusifen/hostscope`,
          );
          return;
        }

        if (configOk && !repo) {
          fail(
            'The CMS cannot start: config.yml has no backend.repo',
            'Add <code>backend.repo</code> as <code>owner/repo</code> in ' +
              '<code>/admin/config.yml</code>, then redeploy.',
            'Could not find a top-level `repo:` key under `backend:`.',
          );
          return;
        }

        fail(
          'The CMS did not start',
          'The bundle loaded but never rendered. Open the browser console for the ' +
            'underlying error — Sveltia prints configuration problems there.',
          `config.yml reachable: ${configOk}\nbackend.repo: ${repo ?? '(not found)'}\nsveltia-cms.js: /admin/sveltia-cms.js`,
        );
      }
    </script>
  </body>
</html>
